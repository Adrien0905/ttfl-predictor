name: Update NBA stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install nba_api

      - name: Refresh player averages
        run: python update_stats.py

      - name: Commit players_db.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/players_db.json
          if git diff --cached --quiet; then
            echo "Aucune moyenne à mettre à jour."
          else
            git commit -m "Refresh NBA player averages"
            git push
          fi
